[package]
name = "yeno-controller"
version = "0.1.0"
description = "YENO native controller"
edition = "2021"
[lib]
name = "yeno_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.4.0", features = [] }
tauri-codegen = { version = "=2.4.0", default-features = false }
tauri-plugin = { version = "=2.4.0", default-features = false }
[dependencies]
tauri = { version = "=2.8.2", features = [] }
tauri-plugin-http = "=2.5.2"
tauri-plugin-stronghold = { version = "=2.3.0", features = ["kdf"] }
# Match the native family in Tauri 2.8.2's release Cargo.lock. Its caret
# requirements otherwise mix newer runtime traits with an older Wry adapter.
# Keep these constraints while the Android workflow regenerates Cargo.lock.
tauri-runtime = { version = "=2.8.0", default-features = false }
tauri-runtime-wry = { version = "=2.8.0", default-features = false }
tauri-utils = { version = "=2.7.0", default-features = false }
tauri-macros = { version = "=2.4.0", default-features = false }
tauri-plugin-fs = { version = "=2.4.2", default-features = false }
tao = { version = "=0.34.1", default-features = false }
wry = { version = "=0.53.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.scrypt]
opt-level = 3
