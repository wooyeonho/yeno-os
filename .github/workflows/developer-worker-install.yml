name: Apply hash-verified BLACKHOLE development patch
on:
  push:
    branches: [blackhole/developer-worker-20260913]
    paths: [.github/workflows/developer-worker-install.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify authored bytes and prepare source-only tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'wooyeonho/yeno-os'
          assert os.environ['GITHUB_REF'] == 'refs/heads/blackhole/developer-worker-20260913'
          parts = ['0','1','2','3a','3b','4']
          encoded = ''.join(pathlib.Path('.blackhole-install/capsule-'+i+'.txt').read_text().strip() for i in parts)
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == '3df2cdf87e215b9be0d268ca01e21799fed2cdd3432ee41fbdf7ab6720f9e328'
          entries = json.loads(lzma.decompress(payload, memlimit=128*1024*1024))
          allowed = ['.github/workflows/developer-worker-bootstrap.yml','.github/workflows/developer-worker.yml','AGENTS.md','CHANGELOG.md','docs/DEVELOPER_WORKER_20260913.md','package.json','runtime/lib/agent.mjs','runtime/lib/backup.mjs','runtime/lib/job-view.mjs','runtime/lib/repository-patch.mjs','runtime/lib/store.mjs','runtime/server.mjs','runtime/test/repository-api.test.mjs','runtime/test/repository-patch.test.mjs','workers/developer/Verification.Dockerfile','workers/developer/cli.mjs','workers/developer/gateways.mjs','workers/developer/gateways.test.mjs','workers/developer/verify-runtime.mjs','workers/developer/worker.mjs','workers/developer/worker.test.mjs']
          assert [e['path'] for e in entries] == allowed
          tree = []
          for entry in entries:
              p = pathlib.Path(entry['path'])
              assert not any(q.is_symlink() for q in [p,*p.parents])
              before = p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(before).hexdigest() == entry['before'], str(p)
              s = before.decode('utf-8')
              previous = len(s)
              for i,j,replacement in reversed(entry['edits']):
                  assert 0 <= i <= j <= previous
                  s = s[:i] + replacement + s[j:]
                  previous = i
              assert hashlib.sha256(s.encode('utf-8')).hexdigest() == entry['after'], str(p)
              if str(p).startswith('.github/'):
                  continue
              assert not entry['delete']
              tree.append({'path':str(p),'mode':'100644','type':'blob','content':s})
          for i in parts:
              tree.append({'path':'.blackhole-install/capsule-'+i+'.txt','mode':'100644','type':'blob','sha':None})
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/wooyeonho/yeno-os/'+path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          old = api('git/commits/'+parent)
          result = api('git/trees', {'base_tree':old['tree']['sha'],'tree':tree})
          print('BLACKHOLE_INTERMEDIATE_TREE='+result['sha'])
          print('BLACKHOLE_PARENT='+parent)
          print('BLACKHOLE_SOURCE_PATHS='+str(len(allowed)))
          # Workflow changes require the separate authorized GitHub connector.
          # No branch update, deployment, model call, or candidate-code execution.
          PY
