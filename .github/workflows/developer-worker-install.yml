name: Apply hash-verified BLACKHOLE development patch
on:
  push:
    branches: [blackhole/developer-worker-20260913]
    paths: [.github/workflows/developer-worker-install.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fixed source bytes and create source-only tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='wooyeonho/yeno-os'
          assert os.environ['GITHUB_REF']=='refs/heads/blackhole/developer-worker-20260913'
          parts=['0','1','2','3a','3b','4']
          data=base64.b64decode(''.join(pathlib.Path('.blackhole-install/capsule-'+i+'.txt').read_text().strip() for i in parts),validate=True)
          assert hashlib.sha256(data).hexdigest()=='3df2cdf87e215b9be0d268ca01e21799fed2cdd3432ee41fbdf7ab6720f9e328'
          entries=json.loads(lzma.decompress(data,memlimit=128*1024*1024))
          assert len(entries)==21
          tree=[]
          for e in entries:
              p=pathlib.Path(e['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert not any(x.is_symlink() for x in [p,*p.parents])
              b=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(b).hexdigest()==e['before'],str(p)
              s=b.decode();limit=len(s)
              for i,j,replacement in reversed(e['edits']):
                  assert 0<=i<=j<=limit
                  s=s[:i]+replacement+s[j:];limit=i
              assert hashlib.sha256(s.encode()).hexdigest()==e['after'],str(p)
              if str(p).startswith('.github/'):continue
              assert not e['delete']
              tree.append(dict(path=str(p),mode='100644',type='blob',content=s))
          for i in parts:tree.append(dict(path='.blackhole-install/capsule-'+i+'.txt',mode='100644',type='blob',sha=None))
          def api(p,data=None):
              req=urllib.request.Request('https://api.github.com/repos/wooyeonho/yeno-os/'+p,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          parent=os.environ['GITHUB_SHA']
          base=api('git/commits/'+parent)['tree']['sha']
          result=api('git/trees',dict(base_tree=base,tree=tree))
          print('BLACKHOLE_INTERMEDIATE_TREE='+result['sha'])
          print('BLACKHOLE_PARENT='+parent)
          # No workflow writes, ref updates, candidate execution, or model calls.
          PY
