name: BLACKHOLE Windows desktop package
on:
  push:
    branches: [codex, 'blackhole/**']
    paths:
      - '.github/workflows/desktop-windows.yml'
      - 'scripts/build-desktop-windows.ps1'
      - 'scripts/test-desktop-windows.ps1'
      - 'scripts/desktop/**'
      - 'runtime/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked runtime dependencies without lifecycle scripts
        shell: powershell
        run: |
          npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build private portable Windows package
        shell: powershell
        run: |
          & ./scripts/build-desktop-windows.ps1 -Root $env:GITHUB_WORKSPACE -OutputDirectory "$env:RUNNER_TEMP/blackhole-desktop-build" -SourceSha $env:GITHUB_SHA
          if (-not $?) { exit 1 }
      - name: Extract archive and exercise compiled EXE, DPAPI and real core
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/blackhole-desktop-evidence" | Out-Null
          $zip = Get-ChildItem "$env:RUNNER_TEMP/blackhole-desktop-build/*.zip" | Select-Object -First 1
          & ./scripts/test-desktop-windows.ps1 -Archive $zip.FullName -EvidencePath "$env:RUNNER_TEMP/blackhole-desktop-evidence/windows-desktop.json"
          if (-not $?) { exit 1 }
      - name: Upload installable private ZIP only after acceptance
        uses: actions/upload-artifact@v4
        with:
          name: BLACKHOLE-Windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blackhole-desktop-build/*.zip
            ${{ runner.temp }}/blackhole-desktop-build/*.zip.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-desktop-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/blackhole-desktop-evidence/windows-desktop.json
          retention-days: 7
          if-no-files-found: warn
