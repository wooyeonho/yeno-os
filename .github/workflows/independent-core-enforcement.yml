      - name: Commit verified boundary
        run: |
          if git diff --quiet -- runtime/lib/provider-config.mjs runtime/lib/autopilot.mjs runtime/lib/agent.mjs runtime/public/autopilot-view.mjs runtime/test/independent-core.test.mjs docs/INDEPENDENT_OS_20260913.md CHANGELOG.md; then
            echo 'No code changes required.'
