name: BLACKHOLE private worker source verification
on:
  push:
    branches: [blackhole/developer-worker-20260913]
    paths: [.github/workflows/developer-worker-bootstrap.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/blackhole-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/blackhole-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/blackhole-source/commit.txt"
          sha256sum "$RUNNER_TEMP/blackhole-source/source.tar" > "$RUNNER_TEMP/blackhole-source/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-private-source
          path: ${{ runner.temp }}/blackhole-source/
          retention-days: 1
          if-no-files-found: error
