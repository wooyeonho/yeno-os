name: Verify runtime on request

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked UI verification dependencies
        run: npm ci --prefix apps/controller --ignore-scripts --no-audit --no-fund
      - name: Run runtime tests
        run: npm test
      - name: Verify browser login and durable request recovery
        run: npm run verify:web
      - name: Verify research evidence and answer across browser restart
        run: node scripts/verify-research-ui.mjs
