<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="BLACKHOLE 자비스 — 실제 본체 상태와 작업 결과를 확인하고 요청합니다.">
<title>JARVIS · BLACKHOLE</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/jarvis.css">
</head>
<body>
<div id="pair-screen" class="pair-screen" hidden><div class="pair-card">
  <span class="eyebrow">BLACKHOLE / JARVIS</span>
  <h1>본체와 연결</h1>
  <p>이 기기의 연결을 요청한 뒤, 이미 연결된 운영실에서 승인하세요. 비밀값을 옮길 필요는 없습니다.</p>
  <button id="device-connect" class="button" type="button">이 기기 연결 요청</button>
  <p id="device-connect-status" role="status" aria-live="polite"></p>
  <p id="device-connect-reference" class="reference" hidden></p>
  <label class="remember"><input id="remember-browser" type="checkbox" checked> 이 기기에서 30일 유지</label>
  <form id="pair-form" hidden><input id="pair-token" type="password" autocomplete="off" aria-label="레거시 연결 키"><button id="pair-key-toggle" type="button">키 보기</button><button type="submit">연결</button></form>
  <div id="pair-error" role="alert"></div>
  <button id="web-retry" class="button subtle" type="button" hidden>다른 탭을 닫은 뒤 다시 연결</button>
</div></div>

<div class="app" id="app">
  <canvas id="orb" aria-hidden="true"></canvas>
  <div class="scene-vignette" aria-hidden="true"></div>
  <header class="bar">
    <a class="brand" href="/" aria-label="BLACKHOLE 운영실"><span>BLACKHOLE</span><strong>JARVIS</strong></a>
    <div class="status" role="status"><span class="activity"><span class="dot off" id="dot"></span><b id="mode">연결 중</b></span><b id="model">모델 확인 중</b><span>HEARTBEAT <b id="hb">—</b></span><button id="control-toggle" class="control-toggle" type="button" aria-controls="controls" aria-expanded="false">직접 조종</button></div>
  </header>
  <main class="stage">
    <div class="speech"><span class="eyebrow">LIVE CORE / NOW</span><p class="line" id="line" aria-live="polite">연결을 확인하고 있어.</p><div class="doing" id="doing"></div></div>
  </main>
  <form class="ask" id="ask" autocomplete="off"><button class="command-mode" id="command-mode" type="button" aria-pressed="false" aria-label="대화 모드로 전환">작업</button><label class="sr-only" for="in">자비스에게 요청</label><input id="in" placeholder="무엇을 함께 해볼까?" maxlength="2000"><button type="submit" id="send" aria-label="요청 보내기">보내기 <span aria-hidden="true">↗</span></button></form>
  <aside id="controls" class="controls" aria-label="자비스 직접 조종" hidden>
    <div class="controls-head"><div><span class="eyebrow">OWNER CONTROL</span><h2>직접 조종</h2></div><button id="control-close" type="button" aria-label="조종 화면 닫기">×</button></div>
    <div class="control-facts"><div><span>의지</span><strong id="will-state">확인 중</strong></div><div><span>생명</span><strong id="life-state">확인 중</strong></div><div><span>권한</span><strong id="authority-state">확인 중</strong></div></div>
    <p class="control-explain">자율 운영은 허가된 범위에서만 일합니다. 승인 대기와 전체 멈춤은 소유자가 결정합니다.</p>
    <div class="gate" id="gate" hidden><span id="gate-text"></span><a class="btn p" href="/">운영실에서 승인</a></div>
    <div class="hint" id="hint" role="status" hidden></div>
    <div class="control-actions"><button id="autopilot-toggle" type="button" disabled>자동 운영 확인 중</button><button id="emergency-toggle" type="button" disabled>전체 멈춤</button></div>
    <div class="control-jobs"><h3>최근 작업</h3><div id="control-job-list">본체 연결을 기다립니다.</div></div>
    <p id="control-error" class="control-error" role="alert"></p>
    <a class="control-full" href="/">운영실에서 모든 작업·승인 보기 ↗</a>
  </aside>
</div>
<script type="module" src="/jarvis.mjs"></script>
</body>
</html>
