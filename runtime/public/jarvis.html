<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>자비스</title>
<link rel="icon" href="/icon.svg">
<style>
:root{color-scheme:dark;--bg:#070709;--ink:#ecebf2;--muted:#8b8998;--faint:#4e4c5c;--line:rgba(236,235,242,.1);--glow:#ff4d6d;--warn:#fab219;
  --serif:"Gowun Batang","Nanum Myeongjo","Batang",Georgia,serif;--sans:"IBM Plex Sans KR","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:14px 20px 16px;max-width:820px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--faint)}
.bar b{color:var(--muted);font-weight:400}.bar a{color:var(--faint);text-decoration:none}.bar a:hover{color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--glow);margin-right:7px;animation:blink 2.6s infinite}
.dot.off{background:var(--faint);animation:none}
@keyframes blink{0%,100%{opacity:.3}12%{opacity:1}}
.stage{display:grid;place-items:center;align-content:center;gap:22px;padding-block:18px;text-align:center}
canvas{width:min(44vw,240px);height:min(44vw,240px);display:block}
.line{font-family:var(--serif);font-size:clamp(19px,2.8vw,27px);line-height:1.5;margin:0;max-width:28em;min-height:3em;white-space:pre-wrap;transition:opacity .3s}
.line.fade{opacity:.2}
.doing{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-height:1.4em;max-width:40em}
.hint{font-size:13px;color:var(--warn);max-width:40em;line-height:1.6}
.hint code{font-family:var(--mono);background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;color:var(--ink)}
.gate{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px;color:var(--warn)}
.btn{font:inherit;color:inherit;cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;text-decoration:none}
.btn.p{border-color:var(--glow);color:var(--glow)}
form.ask{display:flex;gap:8px;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px;background:rgba(255,255,255,.02)}
form.ask:focus-within{border-color:var(--muted)}
form.ask input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;outline:none}
form.ask input::placeholder{color:var(--faint)}
form.ask button{font:inherit;cursor:pointer;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:9px 16px;font-weight:500}
form.ask button:disabled{opacity:.5}
/* pairing (same ids as 운영실 so web-client.mjs drives it) */
.pair-screen{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:5}
.pair-card{width:min(420px,100%);display:grid;gap:12px;text-align:center}
.pair-card h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.pair-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.pair-card form{display:grid;gap:8px}
.pair-card input[type=password],.pair-card input[type=text]{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit;font-size:16px}
.pair-card .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pair-card .button{font:inherit;cursor:pointer;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 16px;font-weight:500}
.pair-card .subtle{background:transparent;color:var(--muted);border:1px solid var(--line)}
#pair-error{color:var(--warn);font-size:13px;min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="pair-screen" class="pair-screen" hidden><div class="pair-card">
  <h1>자비스</h1>
  <p>본체와 연결할 개인 연결 키를 넣어줘. 운영실과 같은 키야.</p>
  <form id="pair-form">
    <input id="pair-token" type="password" autocomplete="off" placeholder="개인 연결 키">
    <div class="row"><button id="pair-key-toggle" class="button subtle" type="button" aria-pressed="false">키 보기</button>
      <label><input id="remember-browser" type="checkbox" checked> 이 기기에서 30일 유지</label></div>
    <button class="button" type="submit">깨우기</button>
  </form>
  <div id="pair-error" role="alert"></div>
  <button id="web-retry" class="button subtle" type="button" hidden>다른 탭을 닫았어요 · 다시 연결</button>
</div></div>

<div class="app">
  <div class="bar">
    <span><span class="dot off" id="dot"></span>자비스 · <b id="mode">연결 중</b></span>
    <span style="display:flex;gap:14px;align-items:center"><b id="model">모델 확인 중</b><span>심장 <b id="hb">—</b></span><a href="/" title="운영실">운영실 ↗</a></span>
  </div>
  <main class="stage">
    <canvas id="orb" width="480" height="480" aria-hidden="true"></canvas>
    <p class="line" id="line">…</p>
    <div class="doing" id="doing"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="gate" id="gate" hidden><span id="gate-text"></span><a class="btn p" href="/">운영실에서 승인</a></div>
  </main>
  <form class="ask" id="ask" autocomplete="off"><input id="in" placeholder="말 걸어봐 — 예: 한끼안부 다음 할 일 정해줘"><button type="submit" id="send">보내기</button></form>
</div>
<script type="module" src="/jarvis.mjs"></script>
</body>
</html>
